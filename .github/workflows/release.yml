name: Verify and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify installer and release build
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-installer.sh all
          bash -n install.sh scripts/build-release.sh tests/test-installer.sh
          git diff --check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Build and verify pinned artifact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release.sh "$GITHUB_REF_NAME" dist
          expected="$(sed -n "s/.*SAFE_VIBE_SHA256='\([0-9a-f]\{64\}\)'.*/\1/p" README.md | head -n 1)"
          actual="$(awk '{ print $1 }' "dist/safe-vibe-$GITHUB_REF_NAME.tar.gz.sha256")"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/safe-vibe-$GITHUB_REF_NAME.tar.gz" \
            "dist/safe-vibe-$GITHUB_REF_NAME.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Safe Vibe $GITHUB_REF_NAME" \
            --notes "검증 가능한 Safe Vibe 설치 패키지입니다. 실행 전에 SHA-256을 확인하세요."
